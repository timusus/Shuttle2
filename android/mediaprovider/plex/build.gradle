import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id 'com.google.devtools.ksp'
}

android {
    compileSdk = 37

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    namespace = 'com.simplecityapps.provider.plex'

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
        optIn.add('kotlin.time.ExperimentalTime')
    }
}

dependencies {

    implementation libs.androidx.appcompat
    implementation libs.google.material

    implementation(project(":android:domain"))
    implementation(project(":android:mediaprovider:core"))
    implementation(project(":android:mediaprovider:server"))
    implementation(project(":android:core"))
    implementation(project(":android:networking"))

    ksp libs.moshi.kotlinCodegen

    implementation libs.hilt
    ksp libs.hilt.compiler

    implementation libs.kotlinx.datetime

    testImplementation(testFixtures(project(":android:mediaprovider:server")))
    testImplementation libs.junit
    testImplementation libs.kotest
    testImplementation libs.robolectric
    testImplementation libs.kotlinx.coroutinesTest
}