import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.library'
apply plugin: 'dev.zacsweers.metro'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    compileSdk = 37

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        consumerProguardFiles("consumer-rules.pro")
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    namespace = 'com.simplecityapps.playback'

    buildFeatures.buildConfig = true

    testOptions {
        unitTests {
            // The media session's buttons and notification read the app's strings.
            includeAndroidResources = true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
        optIn.add('kotlin.time.ExperimentalTime')
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX Core
    implementation libs.androidx.core

    // Shuttle Core
    implementation project(path: ':android:core')

    // The playback policy Android shares with iOS: shuffle order, queue publishing and navigation, start positions
    implementation project(path: ':android:playback:core')

    // Shuttle Media Provider
    implementation project(path: ':android:mediaprovider:core')

    // Shuttle Image Loader
    implementation project(path: ':android:imageloader')

    // AndroidX DocumentFile
    implementation libs.androidx.documentfile


    // Chromecast
    implementation libs.google.play.services.cast.framework

    // NanoHttp
    implementation libs.nanohttpd.webserver

    // Media3 ExoPlayer
    implementation(libs.media3.cast)
    implementation(libs.media3.exoplayer)
    implementation(libs.media3.exoplayerHls)
    implementation(libs.media3.session)

    // kotlinx.serialization: the saved EQ bands and now-playing snapshot
    implementation libs.kotlinx.serialization.json

    implementation(project(':android:domain'))
    // Song.date is a kotlinx.datetime.LocalDate; building a Song for an opened file needs it
    implementation libs.kotlinx.datetime

    // Testing
    testImplementation libs.junit
    testImplementation libs.kotest
    testImplementation(libs.mockk)
    testImplementation(libs.kotlinx.coroutinesTest)
    testImplementation libs.robolectric
    // The real ExoPlayer on the JVM: TestExoPlayerBuilder, FakeClock, TestPlayerRunHelper
    testImplementation(libs.media3.testUtils)
    testImplementation(libs.media3.testUtilsRobolectric)
}