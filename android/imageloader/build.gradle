import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.library'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk = 37

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    namespace = 'com.simplecityapps.imageloading'
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Shuttle Core
    implementation project(':android:core')

    // Shuttle Networking
    implementation project(':android:networking')

    // Shuttle MediaProvider Core
    implementation project(':android:mediaprovider:core')

    // TagLib
    implementation(libs.timusus.ktaglib)

    // Hilt
    implementation libs.hilt
    ksp libs.hilt.compiler

    // Palette
    implementation libs.androidx.palette.ktx

    // Coroutines
    implementation libs.kotlinx.coroutinesCore

    // Glide
    implementation libs.glide
    ksp libs.glide.ksp
    implementation libs.glide.okhttp3Integration
    implementation libs.glide.annotations

    implementation project(':android:domain')

    testImplementation libs.junit
    testImplementation libs.kotest
    // Song.date is a kotlinx.datetime.LocalDate
    testImplementation libs.kotlinx.datetime
    // GlideUrl's static init touches android.* framework classes
    testImplementation libs.robolectric
}