import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.library'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk = 37

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    namespace = 'com.simplecityapps.imageloading'
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Shuttle Core
    implementation project(':android:core')

    // Shuttle Networking
    implementation project(':android:networking')

    // Shuttle Domain
    implementation project(':android:domain')

    // Shuttle MediaProvider Core
    implementation project(':android:mediaprovider:core')

    // TagLib
    implementation(libs.timusus.ktaglib)

    // Hilt
    implementation libs.hilt
    ksp libs.hilt.compiler

    // Folder artwork lists SAF document trees
    implementation libs.androidx.documentfile

    // Coroutines
    implementation libs.kotlinx.coroutinesCore

    // Coil
    implementation libs.coil.core
    implementation libs.coil.network.okhttp

    implementation project(':android:domain')

    testImplementation libs.junit
    testImplementation libs.kotest
    // Song.date is a kotlinx.datetime.LocalDate
    testImplementation libs.kotlinx.datetime
    // The fetcher tests decode through Coil and read Android framework classes
    testImplementation libs.robolectric
}