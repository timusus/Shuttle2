# nginx for shuttlemusicplayer.com, in the shuttle-site container (nginx:alpine) behind Traefik.
# Mounted at /etc/nginx/conf.d; the site directory /srv/config/www/shuttlemusicplayer.com is mounted at /srv/site.
# deploy.sh --live syncs this directory and reloads nginx. See ../README.md.
#
# Traefik 1.7's file provider doesn't pass the Host header through (passHostHeader defaults to false), so the
# requested host comes from X-Forwarded-Host, falling back to Host for direct requests.

map $http_x_forwarded_host $site_host {
    ""      $host;
    default $http_x_forwarded_host;
}

# Preview: what deploy.sh last pushed, before it goes live, kept out of search engines.
# Live: every host the old site answered for; anything but https://shuttlemusicplayer.com redirects there.
map $site_host $site_root {
    preview.shuttlemusicplayer.com /srv/site/preview;
    default                        /srv/site/live;
}

map $site_host $site_robots {
    preview.shuttlemusicplayer.com "noindex, nofollow";
    default                        "";
}

map "$site_host:$http_x_forwarded_proto" $site_redirect {
    "shuttlemusicplayer.com:https"        0;
    "~^preview\.shuttlemusicplayer\.com:" 0;
    default                               1;
}

server {
    listen 80 default_server;
    root $site_root;

    add_header X-Robots-Tag $site_robots always;

    if ($site_redirect) { return 301 https://shuttlemusicplayer.com$request_uri; }

    include /etc/nginx/conf.d/common.inc;
}
