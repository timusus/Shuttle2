# nginx for shuttlemusicplayer.com, in the shuttle-site container (nginx:alpine) behind Traefik.
# Mounted at /etc/nginx/conf.d; the site directory /srv/www/shuttlemusicplayer.com is mounted at /srv/site.
# deploy.sh --live syncs this directory and reloads nginx. See ../README.md.

# Live: every host the old site answered for. Anything but https://shuttlemusicplayer.com redirects there.
server {
    listen 80 default_server;
    server_name shuttlemusicplayer.com www.shuttlemusicplayer.com shuttlemusicplayer.app www.shuttlemusicplayer.app;
    root /srv/site/live;

    set $canonical 1;
    if ($host != "shuttlemusicplayer.com") { set $canonical 0; }
    if ($http_x_forwarded_proto = "http") { set $canonical 0; }
    if ($canonical = 0) { return 301 https://shuttlemusicplayer.com$request_uri; }

    include /etc/nginx/conf.d/common.inc;
}

# Preview: what deploy.sh last pushed, before it goes live. Kept out of search engines.
server {
    listen 80;
    server_name preview.shuttlemusicplayer.com;
    root /srv/site/preview;

    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/conf.d/common.inc;
}
