name: CD

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-XX:+HeapDumpOnOutOfMemoryError"

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.version.outputs.name }}

    steps:
      - name: "Extract version from tag"
        id: version
        run: |
          VERSION_CODE=${GITHUB_REF#refs/tags/v}
          YY=$((VERSION_CODE / 1000000))
          MM=$(((VERSION_CODE / 10000) % 100))
          DD=$(((VERSION_CODE / 100) % 100))
          VERSION_NAME=$(printf "20%02d.%02d.%02d" $YY $MM $DD)
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building version $VERSION_NAME ($VERSION_CODE)"

      - name: "Git Checkout"
        uses: actions/checkout@v4

      - name: "Create keystore.ks"
        run: 'echo "${{secrets.KEYSTORE_FILE}}" | base64 -d > ./android/app/keystore.ks'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: "Archive App Bundle"
        run: |
          ./gradlew :android:app:bundleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName="${{ steps.version.outputs.name }}"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          CONFIGURATION: Release

      - name: "Upload App Bundle"
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 1

  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: "Download App Bundle"
        uses: actions/download-artifact@v4
        with:
          name: app-bundle

      - name: "Upload bundle to Play Store"
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          packageName: com.simplecityapps.shuttle
          releaseFiles: bundle/release/app-release.aab
          track: internal
          status: completed
          changesNotSentForReview: false
