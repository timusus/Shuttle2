name: CI

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-XX:+HeapDumpOnOutOfMemoryError"

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10

    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4

      - name: "Lint Project"
        run: "support/scripts/lint"

      # ios/S2/en.lproj/Localizable.strings is generated from Android's strings.xml
      # (ios/scripts/generate-strings.py); without this it drifts silently (#618).
      - name: "Check iOS strings"
        run: "ios/scripts/generate-strings.py --check"

  unit_tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 60

    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: "Create keystore.ks"
        run: 'echo "${{secrets.KEYSTORE_FILE}}" | base64 -d > ./android/app/keystore.ks'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', '**/robolectric.properties') }}

      # One invocation, as in the landing verify: each module's tests run once, with the
      # screenshot classes in Roborazzi verify mode (docs/testing/strategy.md).
      - name: "Run Unit and Snapshot Tests"
        run: "./gradlew testDebugUnitTest :android:app:verifyRoborazziDebug :android:designsystem:verifyRoborazziDebug"

      - name: "Unit Test Results"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/reports/**/*

  ios_kmp_tests:
    name: "KMP iOS Tests"
    runs-on: macos-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 60

    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Kotlin/Native only differs from the JVM run in KMP sources, so a PR that touches none skips the
      # (slow, macOS) run: every later step is gated on this. KMP modules are the ones applying
      # s2.kmp-library; a change to the build logic or version catalog can affect any of them.
      - name: "Detect KMP changes"
        id: kmp
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -Eq '^(shared/|buildSrc/|gradle/|build\.gradle\.kts|settings\.gradle|gradle\.properties|android/[^/]+(/[^/]+)?/src/(commonMain|commonTest|iosMain|iosTest|nativeMain)/|android/[^/]+(/[^/]+)?/build\.gradle\.kts)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No KMP sources changed; skipping."
          fi

      - name: Validate Gradle Wrapper
        if: steps.kmp.outputs.run == 'true'
        uses: gradle/actions/wrapper-validation@v4

      - name: Copy CI gradle.properties
        if: steps.kmp.outputs.run == 'true'
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        if: steps.kmp.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Setup Gradle
        if: steps.kmp.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native compiles and runs every KMP module's commonTest (#821); the JVM run misses
      # illegal test names and native-only runtime differences.
      - name: "Run KMP iOS Simulator Tests"
        if: steps.kmp.outputs.run == 'true'
        run: "./gradlew iosSimulatorArm64Test"

      - name: "KMP iOS Test Results"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-kmp-test-results
          path: |
            **/build/reports/**/*

  instrumented_tests:
    name: "Instrumented Tests"
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 90

    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: "Create keystore.ks"
        run: 'echo "${{secrets.KEYSTORE_FILE}}" | base64 -d > ./android/app/keystore.ks'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: "Run Instrumented Tests (Gradle Managed Device)"
        run: "./gradlew :android:app:smokeGroupDebugAndroidTest"

      - name: "Instrumented Test Results"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results
          path: |
            **/build/reports/androidTests/**/*
