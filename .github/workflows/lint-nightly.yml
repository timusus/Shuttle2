name: Nightly Lint

# AGP Lint (:android:app:lintDebug) is off the landing verify (#537): abortOnError = false and 353
# existing errors mean it can't fail a landing yet, so it runs here on a schedule instead, purely to
# keep the report visible while a baseline gate is designed. ktlint (support/scripts/lint) is off the
# landing verify too: a hook formats every edit, and CI only runs it on pull requests.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-XX:+HeapDumpOnOutOfMemoryError"

jobs:
  lint:
    name: "Lint (ktlint + :android:app:lintDebug)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: "ktlint"
        run: "support/scripts/lint"

      - name: "Run Lint"
        if: always()
        run: "./gradlew :android:app:lintDebug"

      - name: "Lint Report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
