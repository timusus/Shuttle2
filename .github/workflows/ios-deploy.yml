name: "iOS: Deploy to TestFlight"

# Tag-driven iOS twin of continuous_deployment.yml: pushing ios/vYYMMDDNN archives Shuttle Music with
# that build number and uploads it to TestFlight. Signing is headless through an App Store Connect API
# key plus the Apple Distribution certificate in the runner's keychain. Setup and the one-time owner
# steps: ios/DEPLOY.md.
#
# workflow_dispatch is the smoke run: same job, build number = today + 99, IPA exported to disk
# instead of uploaded, so the pipeline can be proven without spending a build number.

on:
  push:
    tags:
      - 'ios/v[0-9]*'  # e.g. ios/v26100301
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Archive & Upload
    # iOS needs macOS: the self-hosted Mac. If it is offline the job waits for it.
    runs-on: mac-builder
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Mac idle-sleeps when nobody is at it, and a Kotlin/Native link or an xcodebuild archive
      # holds no power assertion of its own. `$PPID` is the runner's worker process, so the
      # assertion lasts exactly as long as this job does.
      - name: Keep the Mac awake for the job
        run: nohup caffeinate -is -w "$PPID" >/dev/null 2>&1 &

      - name: Verify commit is on main branch
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit is not on main; only tag commits that have been merged to main"
            exit 1
          fi

      # Tag ios/vYYMMDDNN -> build number YYMMDDNN, marketing version 20YY.MM.DD, exactly as
      # continuous_deployment.yml derives versionCode/versionName. A dispatch run takes today's date
      # with NN=99 and never uploads, so it cannot collide with a real build.
      - name: Extract version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BUILD_NUMBER="$(date +%y%m%d)99"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            BUILD_NUMBER=${GITHUB_REF#refs/tags/ios/v}
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]{8}$ ]]; then
            echo "::error::Tag must be ios/vYYMMDDNN (eight digits), got '$GITHUB_REF'"
            exit 1
          fi
          YY=$((10#$BUILD_NUMBER / 1000000))
          MM=$(((10#$BUILD_NUMBER / 10000) % 100))
          DD=$(((10#$BUILD_NUMBER / 100) % 100))
          MARKETING_VERSION=$(printf "20%02d.%02d.%02d" $YY $MM $DD)
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $MARKETING_VERSION ($BUILD_NUMBER), upload=$([ "$EVENT_NAME" = push ] && echo yes || echo no)"

      - name: Toolchain report
        run: |
          set -euo pipefail
          echo "whoami=$(whoami)"
          xcodebuild -version
          xcodegen --version
          java -version
          command -v xcbeautify >/dev/null && xcbeautify --version || echo "xcbeautify not installed (raw xcodebuild output)"

      - name: Check required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=""
          [ -n "${ASC_KEY_ID:-}" ]     || missing="$missing ASC_KEY_ID"
          [ -n "${ASC_ISSUER_ID:-}" ]  || missing="$missing ASC_ISSUER_ID"
          [ -n "${ASC_API_KEY_P8:-}" ] || missing="$missing ASC_API_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (see ios/DEPLOY.md)"
            exit 1
          fi

      # The .p8 goes to $RUNNER_TEMP, never the checkout, and is removed in the always() step.
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          echo "$ASC_API_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          head -c 27 "$RUNNER_TEMP/AuthKey.p8" | grep -q -- '-----BEGIN PRIVATE KEY-----' \
            || { echo "::error::ASC_API_KEY_P8 did not decode to a PEM private key; store it as base64 of the .p8 file"; exit 1; }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # One persistent Mac whose Gradle home survives between jobs: the Actions cache buys
          # nothing and its post step can hang pushing gigabytes upstream.
          cache-disabled: true
          add-job-summary: on-failure

      # FFmpeg frameworks (ios/Playback/Frameworks, gitignored) and the Release iosArm64
      # Shared.framework. build-ffmpeg.sh keeps a machine-wide cache, so only the first run on this
      # Mac builds FFmpeg from source.
      - name: Build FFmpeg and the shared KMP framework (release, iosArm64)
        run: ios/scripts/build-framework.sh --device --release --build-cache

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive, export and upload
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          UPLOAD: ${{ steps.version.outputs.upload }}
        run: |
          set -euo pipefail
          args=(
            --build-number "$BUILD_NUMBER"
            --marketing-version "$MARKETING_VERSION"
            --skip-shared-framework
            --api-key-path "$RUNNER_TEMP/AuthKey.p8"
            --api-key-id "$ASC_KEY_ID"
            --api-issuer-id "$ASC_ISSUER_ID"
          )
          if [ "$UPLOAD" != "true" ]; then
            args+=(--no-upload)
          fi
          ./archive-and-upload.sh "${args[@]}"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
