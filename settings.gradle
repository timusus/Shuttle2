pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    // Resolves JDK toolchains for builds; the daemon JVM download itself uses the toolchainUrl.* entries in gradle/gradle-daemon-jvm.properties
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "shuttle"

include ':android:app'
include ':android:architecture-tests'
include ':android:baselineprofile'
include ':android:core'
include ':android:designsystem'
include ':android:domain'
include ':android:downloads'
include ':android:fixtures'
include ':android:imageloader'
include ':android:mediaprovider:core'
include ':android:mediaprovider:local'
include ':android:mediaprovider:emby'
include ':android:mediaprovider:jellyfin'
include ':android:mediaprovider:plex'
include ':android:mediaprovider:subsonic'
include ':android:mediaprovider:server'
include ':android:mediaprovider:server-testing'
