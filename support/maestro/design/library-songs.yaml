# design-shots.sh screen: library-songs. The `playback` fixture is seeded, and (for player screens) queued then paused, by the script.
appId: com.simplecityapps.shuttle.dev
---
- runFlow: ../nav/launch-fresh.yaml
- runFlow:
    file: ../device-checks/_library-tab.yaml
    env:
      TAB: Songs
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: library-songs
