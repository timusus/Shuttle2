# design-shots.sh screen: search. The `library` fixture is seeded, and (for player screens) Blue Hours is queued then paused, by the script.
appId: com.simplecityapps.shuttle.dev
---
- runFlow:
    file: ../nav/search.yaml
    env:
      QUERY: "Juniper"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: search
