# design-shots.sh history (#751): plays ${ALBUM} from its album screen, so the play's context is the album (as Jump
# Back In needs), and keeps playing for ${LISTEN_MS}. The library fixture's 32 s tracks count as a play at 16 s and
# as played through at their end; the script pauses the last one part-way with the debug receiver.
appId: com.simplecityapps.shuttle.dev
---
- runFlow: ../nav/launch-fresh.yaml
- runFlow:
    file: ../device-checks/_library-tab.yaml
    env:
      TAB: Albums
- scrollUntilVisible:
    element: "${ALBUM}"
    direction: DOWN
    timeout: 60000
- tapOn: "${ALBUM}"
# "Play" is also the Albums list's play-all and, after a relaunch, the paused mini player's button. Wait for the
# album screen to replace the list; its Play then comes before the mini player's.
- extendedWaitUntil:
    notVisible: "Sort: Album Name"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Play"
    index: 0
# Maestro has no sleep: wait on something that never shows, optionally, while the album plays.
- extendedWaitUntil:
    visible: "never shown, a delay"
    timeout: ${LISTEN_MS}
    optional: true
