# design-shots.sh screen: artist-detail. The `library` fixture is seeded, and (for player screens) Blue Hours is queued then paused, by the script.
appId: com.simplecityapps.shuttle.dev
---
- runFlow: ../nav/launch-fresh.yaml
- runFlow:
    file: ../device-checks/_library-tab.yaml
    env:
      TAB: Artists
- tapOn: "Juniper Static"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: artist-detail
