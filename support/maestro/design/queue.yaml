# design-shots.sh screen: queue. The `library` fixture is seeded, and (for player screens) Blue Hours is queued then paused, by the script.
appId: com.simplecityapps.shuttle.dev
---
- runFlow:
    file: ../nav/open-queue.yaml
    env:
      TITLE: "Cobalt Walk"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: queue
