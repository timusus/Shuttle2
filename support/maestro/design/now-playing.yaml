# design-shots.sh screen: now-playing. The `playback` fixture is seeded, and (for player screens) queued then paused, by the script.
appId: com.simplecityapps.shuttle.dev
---
- runFlow:
    file: ../nav/open-now-playing.yaml
    env:
      TITLE: "Playback One"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: now-playing
