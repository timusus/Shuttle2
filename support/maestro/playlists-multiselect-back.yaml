# #185: in playlist detail, long-press a song to enter multi-select with the contextual toolbar;
# back exits the selection (staying on playlist detail); back again navigates up to the Playlists
# tab (regression check -- a prior bug consumed the first back for navigation instead of clearing
# the selection). Needs a playlist with at least 2 songs, e.g. "TestList" created via Songs tab's
# "Add to Playlist" -> "New Playlist".
appId: com.simplecityapps.shuttle.dev
---
- runFlow:
    file: nav/open-library-tab.yaml
    env:
      TAB: Playlists
- tapOn: "TestList"
- longPressOn: "Artist A Album 1 Track 1"
- assertVisible: "1 selected"
- takeScreenshot: playlists-multiselect-toolbar
- back
- assertNotVisible: "1 selected"
- assertVisible: "Artist A Album 1 Track 1"
- back
- assertVisible: "TestList"
- assertVisible: "Playlists"
