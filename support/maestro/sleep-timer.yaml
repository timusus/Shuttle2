# Set a 5-minute sleep timer from the full player's menu, see it counting down, then stop it; the
# menu then offers the durations again. Setup (support/scripts/checks/sleep-timer.sh): the
# `playback` fixture queued and paused.
appId: com.simplecityapps.shuttle.dev
---
- runFlow: nav/open-now-playing.yaml
- tapOn:
    text: "More options"
    index: 0
- tapOn: "Sleep Timer"
- tapOn: "5 minutes"
- tapOn:
    text: "More options"
    index: 0
- tapOn: "Sleep Timer"
- assertVisible: ".*4:[0-9]{2} remaining"
- takeScreenshot: g-sleep-timer-set
- tapOn: "Stop Timer"
- tapOn:
    text: "More options"
    index: 0
- tapOn: "Sleep Timer"
- assertVisible: "5 minutes"
- takeScreenshot: g-sleep-timer-cancelled
- tapOn: "Close"
