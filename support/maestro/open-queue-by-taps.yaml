# Open the queue from the mini player by taps alone, via the reusable support/maestro/nav/
# subflows. Setup (support/scripts/checks/open-queue-by-taps.sh): the `playback` fixture queued
# with PLAY_ALL and paused, so nav/launch-fresh.yaml's cold launch restores that queue and the
# mini player shows "Playback One".
appId: com.simplecityapps.shuttle.dev
---
- runFlow: nav/open-queue.yaml
- assertVisible: "Playback Five"
- takeScreenshot: open-queue-by-taps
