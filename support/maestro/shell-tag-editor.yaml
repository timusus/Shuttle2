# #377: the Compose shell's song info and tag editor (MainActivity). Setup
# (support/scripts/checks/shell-tag-editor.sh): the `taglib` fixture (Taglib One..Five) added as the
# SAF-backed Shuttle provider, since only that provider can write tags, then the shell launched.
# Opens the first song's info from its row menu on the Songs tab, then selects the song, edits its title
# from the selection's Edit Tags to a non-ASCII one (#388) and checks the list shows it once the write lands;
# the wrapper then reads the file back and rescans.
appId: com.simplecityapps.shuttle.dev
---
- extendedWaitUntil:
    visible: "Library"
    timeout: 15000
- tapOn: "Library"
- tapOn: "Songs"
- extendedWaitUntil:
    visible: "Taglib One"
    timeout: 10000
# Song info from the first row's menu; the action sheet scrolls to it
- tapOn:
    text: "More options"
    rightOf: "Taglib Five"
- scrollUntilVisible:
    element: "Song Info"
    direction: DOWN
- tapOn: "Song Info"
- extendedWaitUntil:
    visible: "Play count"
    timeout: 5000
- assertVisible: "Taglib Five"
- takeScreenshot: shell-song-info
- back
# Edit Tags from a one-song selection
- longPressOn: "Taglib One"
- assertVisible: "1 selected"
# The selection bar's overflow: the only "More options" above the tabs
- tapOn:
    text: "More options"
    above: "Songs"
- tapOn: "Edit Tags"
- extendedWaitUntil:
    visible: "Taglib One"
    timeout: 15000
- takeScreenshot: shell-tag-editor
- tapOn: "Taglib One"
- eraseText
- inputText: "Café — Ünïcødé 日本語"
- tapOn: "Save"
# The write closes the editor (the title field also reads the new title, so wait for it to go first),
# then the Songs tab shows the library's update
- extendedWaitUntil:
    notVisible: "Edit Tags"
    timeout: 30000
- extendedWaitUntil:
    visible: "Café — Ünïcødé 日本語"
    timeout: 10000
- assertVisible: "Successfully updated 1 song"
- takeScreenshot: shell-tag-editor-saved
