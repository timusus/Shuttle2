# Adds the folder named ${FOLDER_NAME} under Music (support/scripts/seed-test-media.sh taglib pushes
# it there first) to Settings > Sources' "Read these folders directly", which reads it through the
# SAF grant rather than MediaStore. Picking the folder starts a scan; the caller waits for it, and
# the flow ends on Settings > Sources.
# support/scripts/checks/_lib.sh's setup_taglib_provider wraps this: it seeds the fixture with the
# S2 scanner selected and waits on DUMP_STATE's librarySongCount. Starts from a fresh launch so it
# runs standalone; navigation matches nav/open-settings.yaml, then Sources (a top-level destination).
appId: com.simplecityapps.shuttle.dev
---
- runFlow: open-settings.yaml
- tapOn: "Sources"
- scrollUntilVisible:
    element: "Read these folders directly"
    direction: DOWN
- tapOn:
    text: "Add folder"
    below: "Read these folders directly"
- runFlow: pick-saf-folder.yaml
- extendedWaitUntil:
    visible: "${FOLDER_NAME}"
    timeout: 10000
# Back to Settings > Sources, where the old onboarding-based flow left off, so callers navigate the same.
- back
