# Open the full-screen player from the mini player. Starts with a fresh launch so this runs
# standalone regardless of the prior screen; selects by id, not text, since the title is the
# current track (dynamic -- whatever the persisted queue restores).
appId: com.simplecityapps.shuttle.dev
---
- runFlow: launch-fresh.yaml
- tapOn:
    id: ".*titleTextView"
