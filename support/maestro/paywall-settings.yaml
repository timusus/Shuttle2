# #380: the S2 Pro paywall, from Settings in the debug ShellActivity. Setup
# (support/scripts/checks/paywall-settings.sh): the shell launched. A debug build is always Pro, so the
# paywall shows the Pro status and no plans; the free, trial and price states are in the Roborazzi
# recordings in docs/design/paywall/.
appId: com.simplecityapps.shuttle.dev
---
- extendedWaitUntil:
    visible: "More"
    timeout: 10000
- tapOn: "More"
- tapOn: "Settings"
- assertVisible: "Stream from Jellyfin, Emby and Plex"
- tapOn: "S2 Pro"
- assertVisible: "You have S2 Pro. Thank you for supporting S2."
- assertVisible: "What you get"
- assertVisible: "Local playback, Chromecast, EQ, Android Auto and downloaded songs stay free"
- assertNotVisible: "Get S2 Pro"
- takeScreenshot: paywall-settings
- back
- assertVisible: "Playback & sound"
