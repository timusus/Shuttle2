# #270: edit the currently playing song's title through the batch tag editor. Long-press "Taglib
# One" (playing, at the top of the queue) opens its popup directly -- queue rows need only a single
# long-press, unlike the playlist screen's per-row popup (see m3u-sync.yaml's comment on that one)
# -- "Edit Tags" opens the dialog pre-filled with its title, then Save. Every tap uses
# waitToSettleTimeoutMs, the same as playback-controls.yaml, because the point of the check is that
# the edit doesn't interrupt playback, so the flow never pauses first. setup_taglib_provider's own
# flow leaves the app on Settings > Sources (or Settings, depending on the last `back`), so the flow
# backs out until the mini player shows, rather than counting `back`s. The keyboard auto-capitalises
# the typed title ("(Edited)"), so the wrapper compares titles case-insensitively. The wrapper
# (support/scripts/checks/tag-edit-queued.sh) checks this alone, before
# support/maestro/tag-edit-not-playing.yaml runs the second edit -- a real SAF tag write is slow
# enough that both edits together can outlast this 180 s fixture track's remaining runtime.
appId: com.simplecityapps.shuttle.dev
---
- launchApp:
    stopApp: false
- repeat:
    while:
      notVisible:
        id: "player_mini"
    times: 4
    commands:
      # A transient frame without the mini player mustn't trigger an extra `back`
      - waitForAnimationToEnd:
          timeout: 3000
      - back
- extendedWaitUntil:
    visible:
      id: "player_mini"
    timeout: 10000
# By id: the Library opens on Songs, where the title text also matches that song's list row
- tapOn:
    id: "player_mini"
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Queue"
    waitToSettleTimeoutMs: 500
- longPressOn:
    text: "Taglib One"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Edit Tags"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Title"
    waitToSettleTimeoutMs: 500
- eraseText
- inputText: "Taglib One (edited)"
# The keyboard covers the dialog's Save button (#438)
- hideKeyboard
- tapOn:
    text: "Save"
    waitToSettleTimeoutMs: 500
