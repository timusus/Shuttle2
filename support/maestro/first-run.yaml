# #379: first run from a clean install, with no onboarding, through the launcher's MainActivity. The
# app opens to the Library with no changelog over it and asks for the music permission; granting it
# starts the S2 scanner, the Library fills with the seeded `playback` fixture, and Settings > Media >
# Sources shows this device on. Run it through support/scripts/checks/first-run.sh, which clears the
# app and seeds the files first; first-run-shell.yaml covers the Compose shell's empty state.
appId: com.simplecityapps.shuttle.dev
---
# launchApp grants every runtime permission unless told otherwise; a new install has none.
- launchApp:
    stopApp: true
    permissions:
      all: unset
- tapOn:
    id: "com.android.permissioncontroller:id/permission_allow_button"
# Debug builds are always Pro, so they thank the user once; release builds only after a purchase.
- runFlow:
    when:
      visible: "Thank You"
    commands:
      - tapOn: "CLOSE"
- assertNotVisible: "Changelog"
- extendedWaitUntil:
    visible: "Playback Artist"
    timeout: 60000
- takeScreenshot: first-run-granted
- runFlow: nav/open-settings.yaml
- tapOn: "Media"
- tapOn: "Sources"
- assertVisible: "This device"
- assertVisible: "Music stored on this phone"
- scrollUntilVisible:
    element: "Servers"
- assertVisible: "Scan now"
