# Settings > Library with both backup rows, screenshotted for the UI review.
# -e NN=<file number> -e MODE=light|dark (the script sets the system theme first).
appId: com.simplecityapps.shuttle.dev
---
- runFlow: ../nav/open-settings.yaml
- tapOn: "Library"
- scrollUntilVisible:
    element:
      text: "Restore library backup"
- assertVisible: "Back up library"
- assertVisible: "Restore library backup"
- takeScreenshot: ${NN}-settings-library-${MODE}
