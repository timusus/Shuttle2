# Helper, not a check: open Library, then one of its sections by name. The section tabs scroll
# horizontally and restore the last section, so a tab past the row's edge isn't on screen -- swipe
# the tab row (portrait, ~12% down, below the small top bar; unverified on a device) until it is. Pass `TAB` (Genres|Playlists|Artists|Albums|Songs|Folders).
appId: com.simplecityapps.shuttle.dev
---
- tapOn:
    text: "Library"
    index: -1
- repeat:
    while:
      notVisible: "${TAB}"
    times: 3
    commands:
      - swipe:
          start: "85%, 12%"
          end: "15%, 12%"
          duration: 400
- repeat:
    while:
      notVisible: "${TAB}"
    times: 3
    commands:
      - swipe:
          start: "15%, 12%"
          end: "85%, 12%"
          duration: 400
- tapOn:
    text: "${TAB}"
    index: 0
