# Helper, not a check: open Library, then one of its sections by name. The section chips scroll
# horizontally and restore the last section, so a chip past the row's edge isn't on screen -- swipe
# the chips (portrait, ~17% down, unverified on a device since #661) until it is. Pass `TAB` (Genres|Playlists|Artists|Albums|Songs|Folders).
appId: com.simplecityapps.shuttle.dev
---
- tapOn:
    text: "Library"
    index: -1
- repeat:
    while:
      notVisible: "${TAB}"
    times: 3
    commands:
      - swipe:
          start: "85%, 17%"
          end: "15%, 17%"
          duration: 400
- repeat:
    while:
      notVisible: "${TAB}"
    times: 3
    commands:
      - swipe:
          start: "15%, 17%"
          end: "85%, 17%"
          duration: 400
- tapOn:
    text: "${TAB}"
    index: 0
