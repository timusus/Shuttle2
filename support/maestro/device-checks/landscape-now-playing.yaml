# #381: Now Playing in landscape. Opens the player from the mini player (nav/open-now-playing.yaml,
# which taps it by test tag), rotates, and checks the title and transport
# controls are still there. Setup: something queued and paused (the wrapper, or any earlier check).
appId: com.simplecityapps.shuttle.dev
---
- runFlow: ../nav/open-now-playing.yaml
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Queue"
    timeout: 10000
- takeScreenshot: dc-381-now-playing-portrait
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: "Playback .*"
    timeout: 10000
- assertVisible: "Play|Pause"
- assertVisible: "Next"
- takeScreenshot: dc-381-now-playing-landscape
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "Queue"
    timeout: 10000
