# Run first by every library-screen flow: a cold start every time, so each screen begins from the same known state.
appId: ${APP_ID}
---
- launchApp
# the nav bar is the known state; a one-off dialog can cover it first
- extendedWaitUntil:
    visible: "Library|Changelog|Thank You"
    timeout: 20000
- runFlow:
    when:
      visible: "Changelog"
    commands:
      - pressKey: back
- runFlow:
    when:
      visible: "Thank You"
    commands:
      - tapOn: "CLOSE"
- extendedWaitUntil:
    visible: "Library"
    timeout: 10000
