# Lyrics show only for songs that have them: the server has none, so turn on the LRCLIB lookup first. Maestro can't read
# the toggle row's checked state, so tap it, and tap it again if the setting was already on (no Lyrics button).
appId: ${APP_ID}
---
- runFlow: ../_start.yaml
- runFlow: lyrics-toggle.yaml
- extendedWaitUntil:
    visible: "Show lyrics"
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible: "Show lyrics"
    commands:
      - launchApp:
          stopApp: true
      - runFlow: ../_start.yaml
      - runFlow: lyrics-toggle.yaml
      - extendedWaitUntil:
          visible: "Show lyrics"
          timeout: 20000
- tapOn: "Show lyrics"
- waitForAnimationToEnd:
    timeout: 5000
