# Lyrics show only for songs that have them: the server has none, so turn on the LRCLIB lookup first.
appId: ${APP_ID}
---
- runFlow: ../_start.yaml
- tapOn: "Library"
- tapOn: "Settings"
- tapOn: "Playback & sound"
- runFlow:
    when:
      visible:
        text: "Fetch lyrics online"
        checked: false
    commands:
      - tapOn: "Fetch lyrics online"
- back
- back
- runFlow: ../now-playing.yaml
- extendedWaitUntil:
    visible: "Show lyrics"
    timeout: 20000
- tapOn: "Show lyrics"
- waitForAnimationToEnd:
    timeout: 5000
