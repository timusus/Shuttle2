# The tab chips overflow the screen: scroll them so Genres is fully on screen.
appId: ${APP_ID}
---
- runFlow: ../_start.yaml
- tapOn: "Library"
- swipe:
    start: 90%,21%
    end: 10%,21%
    duration: 400
- tapOn: "Genres"
# a row near the top: the mini player (restored from an earlier flow) covers "Classical"
- extendedWaitUntil:
    visible: "Alternative Rock"
    timeout: 15000
