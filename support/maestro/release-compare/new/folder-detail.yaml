# Runs in the local-music phase, once the app has imported the AVD's local files, so the first folder has songs.
appId: ${APP_ID}
---
- runFlow: folder-list.yaml
# the count's space is a no-break space
- tapOn:
    text: "[0-9]+.songs?"
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
# A folder holding only subfolders (". songs" rows, no m:ss durations as song rows have) shows no tracks; open the first.
# The lookahead skips the demo-mode status bar clock (10:00), which Maestro also sees.
- runFlow:
    when:
      visible: "[0-9]+.songs?"
      notVisible: "(?!10:00$)[0-9]+:[0-9]{2}"
    commands:
      - tapOn:
          text: "[0-9]+.songs?"
          index: 0
      - waitForAnimationToEnd:
          timeout: 5000
