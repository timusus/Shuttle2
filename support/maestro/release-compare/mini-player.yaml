# Starts the target track streaming from the album page; the script pauses it before capture.
appId: ${APP_ID}
---
- runFlow: album-detail.yaml
- tapOn: "${TRACK}"
# the artist's own line appears only in the mini player (the album header joins it with the year)
- extendedWaitUntil:
    visible: "${ARTIST}"
    timeout: 20000
