# Starts the now-playing track (another album from the artist screens) streaming from the album page; the script pauses it before capture.
# The song rows reuse the mini player's titleTextView id, so it's matched inside the peek view.
appId: ${APP_ID}
---
- runFlow:
    file: album-detail.yaml
    env:
      ALBUM: "${PLAYING_ALBUM}"
      ALBUM_TRACK: "${PLAYING_TRACK}"
- tapOn: "${PLAYING_TRACK}"
- extendedWaitUntil:
    visible:
      id: "titleTextView"
      text: "${PLAYING_TRACK}"
      childOf:
        id: "sheet1PeekView"
    timeout: 20000
