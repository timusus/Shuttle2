# #223: the Playlists tab shows a fast scroller, matching the other library tabs. The scroller
# has no text/contentDescription to assert on (it's a bare Compose overlay, auto-hiding after
# 1.5s idle), so a screenshot taken right after opening the tab is the evidence.
appId: com.simplecityapps.shuttle.dev
---
- runFlow:
    file: nav/open-library-tab.yaml
    env:
      TAB: Playlists
- takeScreenshot: playlists-fast-scroller
