# #378: the Compose settings in MainActivity. Setup (support/scripts/checks/settings-compose.sh):
# a reset lane with the shell launched, so every setting is at its default. Opens Settings from the
# More sheet, turns Pure black on, picks the Dark theme, then opens the equalizer from Playback & sound.
appId: com.simplecityapps.shuttle.dev
---
- extendedWaitUntil:
    visible: "More"
    timeout: 10000
- tapOn: "More"
- tapOn: "Settings"
- assertVisible: "Playback & sound"
- tapOn: "Appearance"
# A switch. Maestro doesn't match the checked state on the Compose row, so settings-compose.sh checks
# the stored value after the flow instead.
- tapOn: "Pure black"
# A choice: the dialog closes on the pick and the row shows it
- assertVisible: "Day/Night"
- tapOn: "Theme"
- tapOn: "Dark"
- assertNotVisible: "Day/Night"
- assertVisible: "Dark"
- back
# The equalizer, from Playback & sound
- tapOn: "Playback & sound"
- tapOn: "Equalizer"
- assertVisible: "Use equalizer"
- assertVisible: "Preset"
- assertVisible: "1k"
- takeScreenshot: settings-compose-equalizer
