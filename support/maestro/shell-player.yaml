# #376, #410: the Compose shell's player (MainActivity). Setup (support/scripts/checks/shell-player.sh):
# the `playback` fixture (One..Five, 60 s each) queued with PLAY_ALL and paused, then the shell
# launched at Mini showing "Playback One". Expands the player, plays and pauses, seeks by tapping
# the middle of the seek bar, skips, then opens the queue from the bar, removes Five by swiping it
# away, scrolls back to the transport, drags Four by its handle to the top and taps Three to play it.
# It starts a 30 min sleep timer from the Sleep timer panel, sees the bar's countdown and stops it
# again, then sets 1.5x in the Playback & sound panel and sees it on the bar. Go to artist in the
# menu then settles the sheet to Mini over the Library's artist screen. The wrapper checks the
# resulting queue and speed.
appId: com.simplecityapps.shuttle.dev
---
- extendedWaitUntil:
    visible: "Playback One"
    timeout: 10000
# Mini -> Now Playing by tapping the mini player
- tapOn: "Playback One"
- assertVisible: "Collapse player"
- assertVisible: "Repeat off"
# Play, then pause again so the UI goes idle
- tapOn: "Play"
- assertVisible: "Pause"
- tapOn: "Pause"
- assertVisible: "Play"
# A tap in the middle of the seek bar lands about half way through the minute-long song
- tapOn: "Seek"
- assertVisible: "0:[23]\\d"
- tapOn: "Next"
- assertVisible: "Playback Two"
# The queue opens at the song after the playing one
- tapOn: "Show queue"
- assertVisible: "Playback Five"
# A touch while the queue is still scrolling into view only stops the scroll
- waitForAnimationToEnd:
    timeout: 3000
# Swipe to remove
- swipe:
    from:
      text: "Playback Five"
    direction: LEFT
- assertNotVisible: "Playback Five"
# A slow drag down scrolls the list back until the transport shows over the whole queue
- swipe:
    start: 50%, 35%
    end: 50%, 70%
    duration: 1500
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Repeat off"
# Drag Playback Four (the fourth handle) up to the top
- swipe:
    from:
      text: "Reorder"
      index: 3
    direction: UP
    duration: 1500
# Tap a row to skip to it
- tapOn: "Playback Three"
- takeScreenshot: shell-player-queue
# Sleep timer: start one from its panel, see the countdown on the bar, then stop it
- tapOn: "Sleep timer"
- tapOn: "Start timer"
- assertVisible: "Sleep timer on"
- takeScreenshot: shell-player-sleep-timer
- tapOn: "Stop Timer"
- assertNotVisible: "Sleep timer on"
# Speed: 1.5x from the Playback & sound panel, shown on the bar's button
- tapOn: "Playback & sound"
- tapOn: "1.5×"
- takeScreenshot: shell-player-playback-sound
- assertVisible: ".*Playback speed 1.5×"
- back
- assertVisible: ".*Playback speed 1.5×"
- tapOn: "More options"
- tapOn: "Go to artist"
- extendedWaitUntil:
    visible: "Albums"
    timeout: 5000
- assertVisible: "Playback Album"
- assertNotVisible: "Collapse player"
- takeScreenshot: shell-player-artist
