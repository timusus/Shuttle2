# Shuttle Music on the shared landing queue. Keys and defaults: `land --help`.

issue_repo=timusus/Shuttle2

# land-verify prints the `verify: !!` lines itself, from each phase's log and build-brief's raw
# Gradle log, so no failure_sig_cmd.
verify_cmd=support/scripts/land-verify
verify_timeout=1800
# Confirm, base and bisect runs rerun only the failing tests: land-verify switches on LAND_ONLY and
# runs a name it cannot map to a test source as its whole phase, so an unmatched name still fails.
verify_failed_cmd=support/scripts/land-verify
# Only these paths reach the Gradle/iOS verify, or change how it judges a tree; a docs-only branch
# is never blamed for a failure.
verify_paths=^(android/|shared/|ios/|gradle/|[^/]+\.(gradle|kts|properties|toml)$|\.editorconfig$|support/scripts/(land-verify|ios-tests-for|lint|native-test-names|unit-test|remote-build\.sh)$)
# A batch touching none of these cannot change what the full verify tests; land runs bash -n instead.
# Changelog fragments, iOS scripts/docs/store assets and the verify's own scripts are out: a script is
# exercised by the next code land. A new Android module needs settings.gradle.kts, which is in.
code_paths=^(shared/|gradle/|[^/]+\.(gradle|kts|properties|toml)$|\.editorconfig$|android/(app|architecture-tests|baselineprofile|core|designsystem|domain|downloads|fixtures|imageloader|mediaprovider|networking|playback|presentation|presentation-testing|saf|scrobbling|testing|trial)/|ios/(Config|Playback|S2|S2Tests|S2Widgets|SystemSurfaces|S2\.xcodeproj)/|ios/(project\.yml|ExportOptions\.plist|S2\.storekit)$)

# A stale Kotlin incremental cache, not a branch bug; the retry runs with LAND_RETRY=1, which
# land-verify turns into kotlin.incremental=false.
retry_patterns=Incremental compilation failed
# Real compiler errors win over anything below.
code_failure_patterns=^e: file://
code_failure_patterns=\.java:[0-9]+: error:
code_failure_patterns=^Failed tests:
code_failure_patterns= > .* FAILED$
code_failure_patterns=\.swift:[0-9]+(:[0-9]+)?: error:
code_failure_patterns=^Test Case .* failed
code_failure_patterns=^\*\* (BUILD|TEST) FAILED \*\*
env_failure_patterns=JdkImageTransform|jlink|No matching toolchain|Cannot find a Java installation
env_failure_patterns=Cannot find a (Java|JDK)|daemon JVM|SDK location not found
env_failure_patterns=Failed to install the following Android SDK|No installed JDK
env_failure_patterns=^land-verify: no simulator for the iOS tests
env_failure_patterns=^land-verify: device lease timeout
env_failure_patterns=(lease|xcodegen|xcrun|build-brief): command not found
env_failure_patterns=xcrun: error: (unable to find|invalid active developer path)|You have not agreed to the Xcode license

# Push a push-race rebase straight away when the incoming commits touch none of the batch's files;
# a full re-verify would cost the whole Gradle run again.
push_race_reverify=disjoint

seed_files=local.properties
# Slots are numbered; a plain worktree named pool-<word> is not a slot and must be removed, not released.
pool_dir=.claude/worktrees/pool-[0-9]*
# Relative to the git common dir, so no .git/ prefix.
watermark_file=s2-full-verified

# Known noise: the Kotlin/Native ObjC export rename warning, and GitHub's ruleset bypass notice on
# every push to main.
log_filters=^w: .*Ktor_httpHttpStatusCode\.description' was renamed to .*description_' because of a name collision
log_filters=^remote: (Bypassed rule violations for refs/heads/|- Changes must be made through a pull request)
log_filters=^remote:[[:space:]]*$

# Install the landed build on the test iPhone when it changes what the phone runs; skipped when
# the phone is not reachable. Under the device lease, not the verify one.
post_land_hook=git diff --name-only "$LAND_BASE_SHA" "$LAND_SHA" | grep -Eq '^(ios/|shared/|android/domain/|android/presentation/|android/core/)' || exit 0; udid=00008140-000539602E90401C; xcrun devicectl list devices 2>/dev/null | grep -F "$udid" | grep -Eq 'available|connected' || { echo "iPhone not reachable, skipping device install"; exit 0; }; LAUNCH=0 lease --class device -- ios/scripts/install-device.sh "$udid"
