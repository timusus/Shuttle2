# Read by the claude-config format-on-edit hook: <glob> <command>, {} is the edited file, run from the repo root.
# The code style comes from .editorconfig (ktlint 1.x has no --android flag).
*.kt support/vendor/ktlint/ktlint -F {}
*.kts support/vendor/ktlint/ktlint -F {}
*.swift swiftformat --config ios/.swiftformat --quiet {}
