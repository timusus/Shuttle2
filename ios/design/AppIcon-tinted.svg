<?xml version="1.0" encoding="UTF-8"?>
<!--
  S2 iOS app icon, tinted appearance (iOS 18+). A greyscale mark on black:
  iOS maps the luminance onto the user's tint colour, so the front note is
  brightest and the fold darkest, as in the colour icons. No shadow.
  Regenerate the PNGs with ios/scripts/render-app-icon.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#000000"/>
  <g transform="translate(211.82 190) scale(0.84266)">
