    <path id="fold" fill="#7A7A7A" d="M416.67,189.81L393.52,138.89H486.11Z"/>
    <path id="front-note" fill="#FFFFFF" d="M314.82,138.89V546.30A157.66,157.66 0 1 1 175.93,390.01V27.78A27.78,27.78 0 0 1 203.71,0H435.17L486.11,138.89Z"/>
  </g>
</svg>
