<?xml version="1.0" encoding="UTF-8"?>
<!--
  S2 iOS app icon, dark appearance. Same mark and placement as AppIcon.svg,
  in the brand blue on a deep navy gradient. Regenerate the PNGs with
  ios/scripts/render-app-icon.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132634"/>
      <stop offset="1" stop-color="#050C12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dy="18.52" result="offset"/>
      <feGaussianBlur in="offset" stdDeviation="9" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
    </filter>
    <g id="mark">
      <path id="back-note" fill="#0A97DE" d="M712.97,601.85A157.66,157.66 0 1 1 574.08,445.56V189.81H416.67L356.48,50.92H685.19A27.78,27.78 0 0 1 712.97,78.70Z"/>
      <path id="fold" fill="#046BA3" d="M416.67,189.81L393.52,138.89H486.11Z"/>
      <path id="front-note" fill="#2FBBF8" d="M314.82,138.89V546.30A157.66,157.66 0 1 1 175.93,390.01V27.78A27.78,27.78 0 0 1 203.71,0H435.17L486.11,138.89Z"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
  <g transform="translate(211.82 190) scale(0.84266)">
    <use xlink:href="#mark" filter="url(#shadow)"/>
    <use xlink:href="#mark"/>
  </g>
</svg>
