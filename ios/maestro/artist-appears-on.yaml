# An artist's Appears On shelf (#637): opens Hans Zimmer (his own Black Hawk Down, and credited on Elton John's The
# Lion King on the Jellyfin test server) from Library > Artists, then shoots the hero and the Albums and Appears On
# shelves. iPhone only (the chip rail); signed in already: run sign-in-jellyfin.yaml first.
#
#   OUT=/tmp/s2-637 ios/scripts/maestro-sim.sh artist-appears-on.yaml
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow:
    file: common/library-open.yaml
    env:
      CATEGORY: albumArtists
# The view mode is remembered: the list, where names are rows.
- runFlow:
    when:
      visible: "Show as List"
    commands:
      - tapOn:
          id: "library.viewMode"
      - waitForAnimationToEnd:
          timeout: 5000
- scrollUntilVisible:
    element:
      text: "Hans Zimmer"
    direction: DOWN
    timeout: 180000
- tapOn: "Hans Zimmer"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 1-hero
- scrollUntilVisible:
    element:
      text: "Appears On"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 2-appears-on
- longPressOn:
    id: "detailTile.appearsOn"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 3-appears-on-menu
