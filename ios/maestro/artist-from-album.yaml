# Artist detail opened from album detail's More menu (#700): Home's Recently Added > Frogstomp > More > Go to Artist,
# then shoots the album and the artist's hero, whose photo should start at the top of the screen with the name and
# Play/Shuffle on its bottom, and no title in the bar. Signed in already: run sign-in-jellyfin.yaml first.
#
#   OUT=/tmp/s2-700 ios/scripts/maestro-sim.sh artist-from-album.yaml
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- tapOn: "Frogstomp"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 1-album
- tapOn:
    id: "albumDetail.more"
- tapOn: "Go to Artist"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 2-artist
