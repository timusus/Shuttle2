# Genre cover mosaics (#643): Library > Genres, scrolled to genres spanning several albums, whose rows draw a 2x2
# mosaic of their album covers (fewer than four albums draw the one cover). iPhone only; signed in already: run
# sign-in-jellyfin.yaml first.
#
#   OUT=/tmp/s2-643/mosaic ios/scripts/maestro-sim.sh library-mosaics.yaml
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow:
    file: common/library-open.yaml
    env:
      CATEGORY: genres
- takeScreenshot: 1-genres-top
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 2-genres-scrolled
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 3-genres-further
