# Screenshots of the Library, Settings, Sources, sign-in and Equalizer screens (#624) against a real library.
# Signed in already: run sign-in-jellyfin.yaml first (this flow doesn't clear state), then this, once per
# appearance (xcrun simctl ui <udid> appearance dark|light). On an iPhone the Library root is the chip rail over the
# last-used category (#643); an iPad shows the categories in the sidebar instead, so its chip steps are optional.
#
#   OUT=/tmp/s2-polish-wp4/iphone-light ios/scripts/maestro-sim.sh library-settings-screens.yaml
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- tapOn: "Library"
- extendedWaitUntil:
    visible:
      id: "libraryChips"
    timeout: 60000
    optional: true
- takeScreenshot: 1-library
- runFlow:
    when:
      notVisible:
        id: "libraryChip.songs"
    commands:
      - swipe:
          from:
            id: "libraryChips"
          direction: LEFT
          optional: true
- tapOn:
    id: "libraryChip.songs"
    optional: true
- extendedWaitUntil:
    visible:
      id: "songRow.title"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 2-songs
- tapOn:
    id: "libraryChip.albums"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 3-albums
- tapOn:
    id: "libraryChip.albumArtists"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 4-artists
- tapOn:
    id: "libraryChip.genres"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 5-genres
- tapOn:
    id: "libraryChip.playlists"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 6-playlists
- tapOn:
    id: "settings.open"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 7-settings
- tapOn:
    id: "settings.equalizer"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 8-equalizer
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 8b-equalizer-bands
- tapOn:
    text: "Settings"
    index: 0
- tapOn:
    id: "settings.sources"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 9-sources
- tapOn:
    id: "sources.addServer"
- tapOn:
    id: "serverTypePicker.Jellyfin"
- extendedWaitUntil:
    visible:
      id: "serverSignIn.address"
    timeout: 10000
- takeScreenshot: 10-sign-in
