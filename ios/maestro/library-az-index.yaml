# The Library lists' A–Z index scrubs to a letter (#627): Library > Songs (indexed under any name sort, which the
# default by-album order is), note the top song, jump to a letter, and the top song has scrolled away. Every iOS
# version uses the app's strip (`library.sectionIndex`, #643); a tap on it picks the middle letter. iPhone only: an
# iPad opens Library on the Songs detail. Signed in already: run sign-in-jellyfin.yaml first.
#
#   OUT=/tmp/s2-az/maestro ios/scripts/maestro-sim.sh library-az-index.yaml
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow:
    file: common/library-open.yaml
    env:
      CATEGORY: songs
- extendedWaitUntil:
    visible:
      id: "songRow.title"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- copyTextFrom:
    id: "songRow.title"
- takeScreenshot: 1-songs-top
- tapOn:
    id: "library.sectionIndex"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible:
    text: ${maestro.copiedText}
- assertVisible:
    id: "songRow.title"
- takeScreenshot: 2-songs-scrubbed
# A fling still settling: the first touch on the strip stops it and jumps to the first letter, back to the top song.
- swipe:
    start: 50%,80%
    end: 50%,15%
    duration: 80
- tapOn:
    id: "library.sectionIndex"
    point: 50%,2%
- assertVisible:
    text: ${maestro.copiedText}
- takeScreenshot: 3-songs-flung-then-scrubbed
