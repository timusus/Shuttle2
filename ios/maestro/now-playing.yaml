# Now Playing, its Audio sheet and its queue against a real library (#644): sign in (sign-in-jellyfin.yaml), play
# the first song, open Now Playing, turn shuffle on and repeat to One, then the Audio sheet and the queue. Run with
# ios/scripts/maestro-sim.sh; set the simulator's appearance first for a light or dark pass:
#
#   OUT=/tmp/s2-644/light ios/scripts/maestro-sim.sh now-playing.yaml
appId: com.simplecityapps.shuttle.dev
---
- runFlow: sign-in-jellyfin.yaml
- tapOn: "Library"
- extendedWaitUntil:
    visible: "Songs"
    timeout: 60000
- tapOn: "Songs"
- extendedWaitUntil:
    visible:
      id: "songRow.title"
    timeout: 120000
- tapOn:
    id: "songRow.title"
    index: 2
- extendedWaitUntil:
    visible:
      id: "miniPlayer.playPause"
      text: "Pause"
    timeout: 15000
- tapOn:
    id: "miniPlayer.open"
- extendedWaitUntil:
    visible:
      id: "nowPlaying.bottomBar"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 1-now-playing
# Off > All > One: each reads its mode.
- tapOn:
    id: "nowPlaying.repeat"
- assertVisible:
    id: "nowPlaying.repeat"
    text: ".*All.*"
- takeScreenshot: 2-repeat-all
- tapOn:
    id: "nowPlaying.repeat"
- assertVisible:
    id: "nowPlaying.repeat"
    text: ".*One.*"
- tapOn:
    id: "nowPlaying.shuffle"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 3-shuffle-repeat-one
- tapOn:
    id: "nowPlaying.audio"
# Not waits on the sheets' contents: Maestro doesn't see a sheet over the full-screen cover.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 4-audio
# Down by the grabber: Done isn't visible to Maestro either.
- swipe:
    start: "50%, 49%"
    end: "50%, 95%"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "nowPlaying.queue"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 5-queue
