# Screenshots of every Library category (#643): Songs, Artists and Albums in list and grid mode, Genres and
# Playlists with their mosaic artwork, so row titles, the A–Z index and the chip rail can be compared screen to
# screen. iPhone only (the chip rail); signed in already: run sign-in-jellyfin.yaml first. Leaves Artists and Albums
# in list mode, and Library on Songs.
#
#   OUT=/tmp/s2-643/light ios/scripts/maestro-sim.sh library-tour.yaml
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow:
    file: common/library-open.yaml
    env:
      CATEGORY: genres
# The rail follows the test user's order (Genres, Playlists, Artists, Albums, Songs), each chosen chip scrolled
# to the middle, so the next is on screen.
- takeScreenshot: 1-genres
- tapOn:
    id: "libraryChip.playlists"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 2-playlists
- tapOn:
    id: "libraryChip.albumArtists"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Show as List"
    commands:
      - tapOn:
          id: "library.viewMode"
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: 3-artists-list
- tapOn:
    id: "library.viewMode"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 4-artists-grid
- tapOn:
    id: "library.viewMode"
- tapOn:
    id: "libraryChip.albums"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Show as List"
    commands:
      - tapOn:
          id: "library.viewMode"
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: 5-albums-list
- tapOn:
    id: "library.viewMode"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 6-albums-grid
- tapOn:
    id: "library.viewMode"
- tapOn:
    id: "libraryChip.songs"
- extendedWaitUntil:
    visible:
      id: "songRow.title"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 7-songs
