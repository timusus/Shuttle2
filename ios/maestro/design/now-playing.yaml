# design-shots.sh screen: now-playing. The `library` fixture is imported, with a listening history and Blue Hours paused part-way, by the script.
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow: _queued.yaml
- tapOn:
    id: "miniPlayer.open"
- extendedWaitUntil:
    visible:
      id: "nowPlaying.bottomBar"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: now-playing
