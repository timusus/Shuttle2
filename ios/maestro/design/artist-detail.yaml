# design-shots.sh screen: artist-detail. Signed in already (sign-in-jellyfin.yaml, run once per device by the script).
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow:
    file: _library.yaml
    env:
      CATEGORY: albumArtists
      LABEL: Artists
- scrollUntilVisible:
    element:
      text: "The Mars Volta"
    direction: DOWN
    timeout: 180000
- tapOn: "The Mars Volta"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: artist-detail
