# design-shots.sh screen: artist-detail. The `library` fixture is imported, with a listening history and Blue Hours paused part-way, by the script.
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow:
    file: _library.yaml
    env:
      CATEGORY: albumArtists
      LABEL: Artists
- scrollUntilVisible:
    element:
      text: "Juniper Static"
    direction: DOWN
    timeout: 60000
- tapOn: "Juniper Static"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: artist-detail
