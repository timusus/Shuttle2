# design-shots.sh screen: album-detail. The `library` fixture is imported, with a listening history and Blue Hours paused part-way, by the script.
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow:
    file: _library.yaml
    env:
      CATEGORY: albums
      LABEL: Albums
- scrollUntilVisible:
    element:
      text: "Blue Hours"
    direction: DOWN
    timeout: 60000
- tapOn: "Blue Hours"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: album-detail
