# design-shots.sh screen: library-albums. Signed in already (sign-in-jellyfin.yaml, run once per device by the script).
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow:
    file: _library.yaml
    env:
      CATEGORY: albums
      LABEL: Albums
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: library-albums
