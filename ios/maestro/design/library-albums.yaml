# design-shots.sh screen: library-albums. The `library` fixture is imported, with a listening history and Blue Hours paused part-way, by the script.
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow:
    file: _library.yaml
    env:
      CATEGORY: albums
      LABEL: Albums
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: library-albums
