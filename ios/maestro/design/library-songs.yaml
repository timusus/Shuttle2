# design-shots.sh screen: library-songs. The `library` fixture is imported, with a listening history and Blue Hours paused part-way, by the script.
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow:
    file: _library.yaml
    env:
      CATEGORY: songs
      LABEL: Songs
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: library-songs
