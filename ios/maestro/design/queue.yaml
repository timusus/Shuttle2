# design-shots.sh screen: queue. The `library` fixture is imported, with a listening history and Blue Hours paused part-way, by the script.
# Opens Now Playing, then its queue sheet. Nothing in the sheet reaches Maestro's hierarchy (it still lists Now
# Playing's elements under it, on iOS 26), so the flow can't wait on the sheet and gives it time to settle instead.
# Never tap the queue button again once the sheet is up: the tap lands on a queue row and skips to that song.
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow: _queued.yaml
- tapOn:
    id: "miniPlayer.open"
- extendedWaitUntil:
    visible:
      id: "nowPlaying.queue"
      enabled: true
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "nowPlaying.queue"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: queue
