# design-shots.sh screen: search. The `library` fixture is imported, with a listening history and Blue Hours paused part-way, by the script.
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- tapOn: "Search"
- inputText: "Juniper"
- extendedWaitUntil:
    visible:
      id: "search.result.artist"
    timeout: 30000
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: search
