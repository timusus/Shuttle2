# design-shots.sh screen: search. Signed in already (sign-in-jellyfin.yaml, run once per device by the script).
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- tapOn: "Search"
- inputText: "Hans Zimmer"
- extendedWaitUntil:
    visible:
      id: "search.result.artist"
    timeout: 180000
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: search
