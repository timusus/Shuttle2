# design-shots.sh screen: settings. Signed in already (sign-in-jellyfin.yaml, run once per device by the script).
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- tapOn: "Library"
- extendedWaitUntil:
    visible:
      id: "settings.open"
    timeout: 30000
- tapOn:
    id: "settings.open"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: settings
