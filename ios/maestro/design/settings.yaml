# design-shots.sh screen: settings. The `library` fixture is imported, with a listening history and Blue Hours paused part-way, by the script.
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- tapOn: "Library"
- extendedWaitUntil:
    visible:
      id: "settings.open"
    timeout: 30000
- tapOn:
    id: "settings.open"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: settings
