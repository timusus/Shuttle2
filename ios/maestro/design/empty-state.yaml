# design-shots.sh screen: empty-state. The `library` fixture is imported, with a listening history and Blue Hours paused part-way, by the script.
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- tapOn: "Search"
- inputText: "Zzqxj Vrrk"
- extendedWaitUntil:
    visible:
      id: "search.noResults"
    timeout: 30000
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: empty-state
