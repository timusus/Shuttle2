# Screenshots of the Albums list and Playlists list (#676): the Shuffle toolbar button, no row separators, and the
# Auto Playlists tiles. iPhone only; signed in already: run sign-in-jellyfin.yaml first. Set dark mode with
# `xcrun simctl ui <udid> appearance dark`.
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow:
    file: common/library-open.yaml
    env:
      CATEGORY: albums
- runFlow:
    when:
      visible: "Show as List"
    commands:
      - tapOn:
          id: "library.viewMode"
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: 676-albums
- tapOn:
    id: "libraryChip.playlists"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 676-playlists
