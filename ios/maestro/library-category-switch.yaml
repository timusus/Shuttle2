# The Library's chip rail stays visible and tappable, at rest and scrolled (#624): on iOS 26 the rail once vanished
# under the navigation bar's scroll edge effect, leaving no way to switch category. The root opens on the category
# last chosen, across launches, with no category cards (#643). iPhone only (an iPad shows the categories in the
# sidebar). Signed in already: run sign-in-jellyfin.yaml first.
#
#   OUT=/tmp/s2-643/switch ios/scripts/maestro-sim.sh library-category-switch.yaml
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- runFlow:
    file: common/library-open.yaml
    env:
      CATEGORY: albumArtists
- assertNotVisible:
    id: "libraryCategory.albums"
- takeScreenshot: 1-artists-at-rest
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "libraryChips"
- takeScreenshot: 2-artists-scrolled
# Switch category straight from the scrolled list.
- tapOn:
    id: "libraryChip.albums"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "libraryChip.albums"
- takeScreenshot: 3-albums
# A vertical drag on the rail neither scrolls it nor pulls to refresh.
- swipe:
    from:
      id: "libraryChips"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "importStatus"
- takeScreenshot: 4-rail-dragged-down
# Relaunched, Library opens on Albums again.
- stopApp
- launchApp
- tapOn: "Library"
- extendedWaitUntil:
    visible:
      id: "libraryChips"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "library.viewMode"
- takeScreenshot: 5-relaunched-on-albums
