# Home's suggestion sections on a real library (#633). Signed in already (run sign-in-jellyfin.yaml first on a fresh
# install). Shoots Home as it is (cold start on a fresh install: Shuffle All, Recently Added, Genre Picks), then plays
# two albums from their screens and shuffles a Genre Pick, each for over the 30 s a play needs to count, skips a track
# so the last listen is recorded, and shoots Home again with Jump Back In's grid. Run it again with the simulator in
# dark mode for the dark shots (the plays only add to the history).
#
#   OUT=/tmp/s2-633/iphone ios/scripts/maestro-sim.sh home-sections.yaml
appId: com.simplecityapps.shuttle.dev
---
- launchApp
- tapOn: "Home"
- extendedWaitUntil:
    visible:
      id: "homeTile.album"
    timeout: 180000
# Covers load after the tiles.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 1-home-before
# The first album on Home's shelves, played from its own screen.
- tapOn:
    id: "homeTile.album"
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Play"
    index: 0
- extendedWaitUntil:
    visible:
      id: "miniPlayer.playPause"
      text: "Pause"
    timeout: 20000
# A play counts after 30 s listened; nothing on screen changes meanwhile, so this wait always times out.
- extendedWaitUntil:
    visible: "never-shown-633"
    timeout: 35000
    optional: true
# Maestro's `back` is Android-only: the navigation bar's back button, the first "Home" on screen.
- tapOn:
    text: "Home"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
# A second album: the shelf's next one (the first stays until the listen is recorded, when its queue is replaced).
- scrollUntilVisible:
    element:
      id: "homeTile.album"
      index: 1
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "homeTile.album"
    index: 1
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Play"
    index: 0
- extendedWaitUntil:
    visible:
      id: "miniPlayer.playPause"
      text: "Pause"
    timeout: 20000
- extendedWaitUntil:
    visible: "never-shown-633"
    timeout: 35000
    optional: true
- tapOn:
    text: "Home"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
# A Genre Pick shuffles its genre where it's tapped.
- scrollUntilVisible:
    element:
      id: "homeTile.genre"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "homeTile.genre"
    index: 0
- extendedWaitUntil:
    visible:
      id: "miniPlayer.playPause"
      text: "Pause"
    timeout: 20000
- extendedWaitUntil:
    visible: "never-shown-633"
    timeout: 35000
    optional: true
# A listen is recorded when it ends: skip, then pause. On iOS 26 the mini player is the tab bar's accessory, which
# collapses (no Next) once Home scrolls; back at the top it's full again, with its Pause.
- tapOn:
    id: "miniPlayer.next"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "Jump Back In"
    direction: UP
    timeout: 30000
- tapOn:
    id: "miniPlayer.playPause"
    optional: true
- scrollUntilVisible:
    element:
      id: "homeGrid.cell"
    direction: UP
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 2-home-after
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 3-home-shelves
