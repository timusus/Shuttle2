# The iOS POC end to end against a real server (#587): sign in to Jellyfin through the app (sign-in-jellyfin.yaml,
# from a signed-out launch), then Library > Songs, tap the first song, and the mini player shows that song playing.
# Run it with ios/scripts/maestro-sim.sh, which reads the server's env file and passes it with -e:
#
#   ios/scripts/maestro-sim.sh poc-play.yaml
appId: com.simplecityapps.shuttle.dev
---
- runFlow: sign-in-jellyfin.yaml
- tapOn:
    text: "Library"
    id: "music.note.list"
- extendedWaitUntil:
    visible: "Songs"
    timeout: 60000
- takeScreenshot: 4-library
- tapOn: "Songs"
- extendedWaitUntil:
    visible:
      id: "songRow.title"
    timeout: 120000
- takeScreenshot: 5-songs
- copyTextFrom:
    id: "songRow.title"
    index: 0
- tapOn:
    id: "songRow.title"
    index: 0
- extendedWaitUntil:
    visible:
      id: "miniPlayer.title"
      text: ${maestro.copiedText}
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "miniPlayer.playPause"
      text: "Pause"
    timeout: 15000
- takeScreenshot: 6-mini-player-playing
