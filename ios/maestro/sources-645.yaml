# Sources (#645) against a real Jellyfin server: the Library empty state's Add a Source, then Add Server and a
# Quick Connect sign-in (as sign-in-jellyfin.yaml), the import activity's Open Sources while the import runs, the
# redesigned Sources list and a server's detail. Screenshots under the output dir's <timestamp>/.
#
# Env (exported MAESTRO_-prefixed by ios/scripts/maestro-sim.sh; never commit or print them): MAESTRO_SERVER_URL,
# MAESTRO_API_KEY, and MAESTRO_SERVER_USER, the user the code is approved for.
appId: com.simplecityapps.shuttle.dev
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn:
    id: "onboarding.skip"
- tapOn: "Library"
- tapOn:
    id: "libraryEmpty.addSource"
- extendedWaitUntil:
    visible:
      id: "sources.addServer"
    timeout: 10000
- takeScreenshot: 1-library-empty-add-source-opens-sources
- tapOn:
    id: "sources.addServer"
- tapOn:
    id: "serverTypePicker.Jellyfin"
- extendedWaitUntil:
    visible:
      id: "serverSignIn.address"
    timeout: 10000
- tapOn:
    id: "serverSignIn.address"
- eraseText: 40
- inputText: ${MAESTRO_SERVER_URL}
- tapOn:
    id: "serverSignIn.username"
- inputText: ${MAESTRO_SERVER_USER}
- swipe:
    start: 50%, 22%
    end: 50%, 50%
- extendedWaitUntil:
    visible:
      id: "serverSignIn.quickConnect"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "serverSignIn.quickConnectCode"
    commands:
      - tapOn:
          id: "serverSignIn.quickConnect"
- extendedWaitUntil:
    visible:
      id: "serverSignIn.quickConnectCode"
    timeout: 15000
- copyTextFrom:
    id: "serverSignIn.quickConnectCode"
- runScript:
    file: approve-quick-connect.js
- extendedWaitUntil:
    visible:
      id: "onboarding.continue"
    timeout: 30000
- tapOn:
    id: "onboarding.continue"
- extendedWaitUntil:
    visible:
      id: "sources.server.Jellyfin"
    timeout: 30000
- takeScreenshot: 2-sources-importing
- extendedWaitUntil:
    visible: "Connected"
    timeout: 300000
