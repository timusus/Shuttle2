# Plays the first album from the start (capture.sh shows the Albums category with a hook first), then pauses it ~15 s in,
# so every later frame has the same song, part-way through and not about to end: the mini player, Now Playing and the
# queue have something steady to show. The tiles carry no accessibility ids, so this taps the album by title: change it
# with the test library.
appId: com.simplecityapps.shuttle.dev
---
- extendedWaitUntil:
    visible: ".*And Justice for All"
    timeout: 180000
- tapOn: ".*And Justice for All"
- extendedWaitUntil:
    visible: "Play"
    timeout: 30000
- tapOn: "Play"
- extendedWaitUntil:
    visible:
      id: "miniPlayer.playPause"
      text: "Pause"
    timeout: 30000
# Maestro has no sleep: wait on something that never shows, optionally, for the song to get going.
- extendedWaitUntil:
    visible: "never shown, a delay"
    timeout: 15000
    optional: true
- tapOn:
    id: "miniPlayer.playPause"
