# Plays Undertow from the start (capture.sh shows the Albums category with a hook first), then pauses it ~20 s in, so
# every later frame has the same song, part-way through and not about to end: the mini player, Now Playing and the
# queue have something steady to show, in its cover's colour. The tiles carry no accessibility ids, so this finds the
# album by title: change it with the sample library (build-library.py).
appId: com.simplecityapps.shuttle.dev
---
- scrollUntilVisible:
    element: "Undertow"
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: "Undertow"
- extendedWaitUntil:
    visible: "Play"
    timeout: 30000
- tapOn: "Play"
- extendedWaitUntil:
    visible:
      id: "miniPlayer.playPause"
      text: "Pause"
    timeout: 30000
# Maestro has no sleep: wait on something that never shows, optionally, for the song to get going.
- extendedWaitUntil:
    visible: "never shown, a delay"
    timeout: 20000
    optional: true
- tapOn:
    id: "miniPlayer.playPause"
