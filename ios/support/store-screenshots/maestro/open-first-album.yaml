# Opens the first album of the Albums list (capture.sh shows the Albums category with a hook first). The tiles carry
# no accessibility ids, so this taps the first one by title: change it with the test library.
appId: com.simplecityapps.shuttle.dev
---
- extendedWaitUntil:
    visible: ".*And Justice for All"
    timeout: 60000
- tapOn: ".*And Justice for All"
- waitForAnimationToEnd:
    timeout: 5000
