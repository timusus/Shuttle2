# Opens the Shuttle Music Pro paywall from Settings (capture.sh opens the Settings sheet with a hook first) and waits
# for the App Store's price.
appId: com.simplecityapps.shuttle.dev
---
- extendedWaitUntil:
    visible:
      id: "settings.pro"
    timeout: 15000
- tapOn:
    id: "settings.pro"
- extendedWaitUntil:
    notVisible: "Loading price…"
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
