# Opens the Shuttle Music Pro paywall from Settings (capture.sh opens the Settings sheet with a hook first, after the
# `paywall` hook has set the price the paywall shows).
appId: com.simplecityapps.shuttle.dev
---
- extendedWaitUntil:
    visible:
      id: "settings.pro"
    timeout: 15000
- tapOn:
    id: "settings.pro"
- waitForAnimationToEnd:
    timeout: 5000
