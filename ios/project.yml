# XcodeGen definition of the S2 iOS app (#587, docs/architecture/ios-port.md). The source of truth for the
# project: edit this, then `xcodegen generate`. Layout and settings follow Shuttle Podcasts' mobile/ios.
name: S2
options:
  bundleIdPrefix: com.simplecityapps.shuttle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    # Pinned: later releases declare `.visionOS(.v2)` under a 5.9 tools version, which Xcode 27's
    # SwiftPM rejects ("'v2' is unavailable"), so `from:` resolves to a manifest that won't load.
    exactVersion: "0.10.3"
  # The gapless engine (#588): a local package, see Playback/README.md.
  S2Playback:
    path: Playback
settings:
  # Empty by default so the project builds for the simulator without a team; device builds pass
  # APP_TEAM on the xcodebuild command line.
  DEVELOPMENT_TEAM: "$(APP_TEAM)"
  TARGETED_DEVICE_FAMILY: "1,2"
  # Shared.framework ships an arm64 simulator slice only (iosSimulatorArm64), so a Release simulator
  # build (ONLY_ACTIVE_ARCH=NO) would typecheck x86_64 against a module that has no slice for it.
  "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  S2:
    type: application
    platform: iOS
    sources:
      - path: S2
    # PrivacyInfo.xcprivacy (#607) must be a resource in the app bundle, not compiled as source.
    resources:
      - path: S2/PrivacyInfo.xcprivacy
    dependencies:
      # Brings the four FFmpeg frameworks (the package's binary targets, from
      # ios/scripts/build-ffmpeg.sh). Xcode embeds and signs a package's dynamic binary targets in
      # S2.app/Frameworks by itself, so there is no `embed:` entry: one would copy them twice.
      - package: S2Playback
        product: S2Playback
    # Keys the generated Info.plist has no INFOPLIST_KEY_ setting for. Xcode merges this file with the
    # generated keys below (GENERATE_INFOPLIST_FILE stays on).
    info:
      path: S2/Info.plist
      properties:
        # XcodeGen writes 1.0 / 1 otherwise, and the file wins over the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Keep playing with the screen locked or the app in the background (#588).
        UIBackgroundModes: [audio]
        # This device's music (#590): Documents shows in Files ("On My iPhone > Shuttle Music") and Finder's file
        # sharing, so music can be copied in, and files opened there are read in place.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Jellyfin and Emby servers are often plain http on the LAN, or https with a self-signed
        # certificate; the servers' own iOS apps allow both the same way (#587). Do NOT add
        # NSAllowsLocalNetworking: on iOS 10+ it makes the system ignore NSAllowsArbitraryLoads, which
        # would break a plain-http server reached by a public hostname (#608).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Local network access prompt (#608): the app discovers and connects to Jellyfin/Emby/Plex
        # servers on the user's LAN, not for any tracking or discovery purpose.
        NSLocalNetworkUsageDescription: "Shuttle Music uses your local network to find and connect to Jellyfin, Emby and Plex media servers on your Wi-Fi network."
        # The app only uses standard HTTPS/TLS to reach user-configured media servers; no proprietary
        # or non-exempt encryption (#608).
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Debug installs beside the store app; Release is the App Store Connect bundle id (configs below).
        PRODUCT_BUNDLE_IDENTIFIER: com.simplecityapps.shuttle.dev
        PRODUCT_NAME: S2
        # ios/archive-and-upload.sh overrides the S2_ settings on the xcodebuild command line:
        # build number YYMMDDNN (the ios/vYYMMDDNN tag's digits), marketing version 20YY.MM.DD.
        S2_MARKETING_VERSION: "2026.09.27"
        S2_BUILD_NUMBER: "1"
        MARKETING_VERSION: $(S2_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(S2_BUILD_NUMBER)
        GENERATE_INFOPLIST_FILE: true
        # The neutral accent: Assets.xcassets' AccentColor (near-black / near-white). The system ignores a neutral asset as the global tint, so S2App applies .tint(.s2Accent) and AccentTint sets UIKit's (Theme/Colors.swift).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Assets.xcassets/AppIcon.appiconset, rendered from ios/design/*.svg by scripts/render-app-icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Shuttle Music"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: targeted
        # xcodegen's iOS application preset sets this per target, overriding the project default above.
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # The shared-framework slice is chosen by SDK, not configuration: `-framework Shared` takes the
        # first Shared.framework on the search path, and the simulator slice does not link for a device.
        # Build the one you need first with scripts/build-framework.sh.
        Debug:
          "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
          "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "-framework"
            - "Shared"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.simplecityapps.shuttle
          "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
          "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "-framework"
            - "Shared"
  S2Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: S2Tests
    dependencies:
      - target: S2
      - package: ViewInspector
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/S2.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/S2
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: targeted
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # Search path only, for `import Shared`: the Kotlin code is linked into the host app, and the
        # test bundle resolves it through BUNDLE_LOADER. Linking the static framework here as well
        # would put a second Kotlin runtime in the process.
        Debug:
          FRAMEWORK_SEARCH_PATHS:
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
schemes:
  S2:
    build:
      targets:
        S2: all
        S2Tests: [test]
    run:
      config: Debug
      storeKitConfiguration: S2.storekit
    test:
      config: Debug
      targets:
        - S2Tests
