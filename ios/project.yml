# XcodeGen definition of the S2 iOS app (#587, docs/architecture/ios-port.md). The source of truth for the
# project: edit this, then `xcodegen generate`. Layout and settings follow Shuttle Podcasts' mobile/ios.
name: S2
options:
  bundleIdPrefix: com.simplecityapps.shuttle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: "0.10.5"
  # The gapless engine (#588): a local package, see Playback/README.md.
  S2Playback:
    path: Playback
  # Crash reporting and product analytics (#776), each started only while its Settings > Privacy switch is on
  # (Platform/Telemetry). Their keys come from Config/Telemetry.xcconfig, never from this file.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.30.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.89.0"
settings:
  base:
    # Empty by default so the project builds for the simulator without a team; device builds pass
    # APP_TEAM on the xcodebuild command line.
    DEVELOPMENT_TEAM: "$(APP_TEAM)"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Shared.framework ships an arm64 simulator slice only (iosSimulatorArm64), so a Release simulator
    # build (ONLY_ACTIVE_ARCH=NO) would typecheck x86_64 against a module that has no slice for it.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    # The app and its widget extension carry the same versions, as the App Store requires.
    # ios/archive-and-upload.sh overrides the S2_ settings on the xcodebuild command line:
    # build number YYMMDDNN (the ios/vYYMMDDNN tag's digits), marketing version 20YY.MM.DD.
    S2_MARKETING_VERSION: "2026.09.27"
    S2_BUILD_NUMBER: "1"
    MARKETING_VERSION: $(S2_MARKETING_VERSION)
    CURRENT_PROJECT_VERSION: $(S2_BUILD_NUMBER)
  configs:
    # The App Group the app shares Now Playing with its widgets through (#758, NowPlayingStore): the Debug
    # app's beside the store app's, as the bundle ids are. Both must be registered in the developer portal.
    Debug:
      S2_APP_GROUP: group.com.simplecityapps.shuttle.dev
    Release:
      S2_APP_GROUP: group.com.simplecityapps.shuttle
targets:
  S2:
    type: application
    platform: iOS
    sources:
      - path: S2
      # The playback App Intents and the widgets' shared state, compiled into the widget extension as well (#758)
      - path: SystemSurfaces
    # PrivacyInfo.xcprivacy (#607) must be a resource in the app bundle, not compiled as source.
    resources:
      - path: S2/PrivacyInfo.xcprivacy
    dependencies:
      # The engine and the local-file tag reader. Both link shuttle-playback's one static FFmpeg (#957):
      # nothing is embedded in S2.app/Frameworks.
      - package: S2Playback
        product: S2Playback
      - package: S2Playback
        product: S2Tags
      # The widgets and the Control Center control (#758), embedded in S2.app/PlugIns
      - target: S2Widgets
      - package: Sentry
        product: Sentry
      - package: PostHog
        product: PostHog
    # The telemetry and Last.fm keys: Config/S2.xcconfig includes Telemetry.xcconfig and LastFm.xcconfig, which
    # include the gitignored files scripts/generate-telemetry-config.sh and generate-lastfm-config.sh write
    # (build-framework.sh runs both). Without them the keys are empty: neither telemetry SDK starts, and scrobbling
    # is off.
    configFiles:
      Debug: Config/S2.xcconfig
      Release: Config/S2.xcconfig
    # Keys the generated Info.plist has no INFOPLIST_KEY_ setting for. Xcode merges this file with the
    # generated keys below (GENERATE_INFOPLIST_FILE stays on).
    info:
      path: S2/Info.plist
      properties:
        # XcodeGen writes 1.0 / 1 otherwise, and the file wins over the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The languages with a Localizable table (S2/<id>.lproj), one per Android translation:
        # ios/scripts/generate-strings.py writes them and --check holds this list to them.
        CFBundleLocalizations: [en, de, en-GB, es, es-ES, fr, hi, it, ja, nl, pl, pt-BR, pt-PT, ru, tr, zh-Hans]
        # Keep playing with the screen locked or the app in the background (#588), and sync the servers daily in the
        # background (#771, BackgroundRefresh.swift).
        UIBackgroundModes: [audio, fetch]
        # Siri's media domain (#951): "play <artist> on Shuttle Music", on the phone and in CarPlay
        INIntentsSupported: [INPlayMediaIntent]
        # "play <artist> on Shuttle": Siri and App Shortcuts also answer to the short name
        INAlternativeAppNames:
          - INAlternativeAppName: Shuttle
            INAlternativeAppNamePronunciationHint: shuttle
        NSSiriUsageDescription: Shuttle Music uses Siri to play the songs, albums, artists and playlists in your library when you ask for them by voice.
        # Playback diagnostics (#897): these categories keep their info lines in the unified log, so
        # `log collect` after a stall on the device has them; debug stays in memory only.
        OSLogPreferences:
          com.simplecityapps.shuttle2:
            playback: {Level: {Enable: Info, Persist: Info}}
            audio-engine: {Level: {Enable: Info, Persist: Info}}
            session: {Level: {Enable: Info, Persist: Info}}
          com.simplecityapps.shuttle-playback:
            download: {Level: {Enable: Info, Persist: Info}}
        BGTaskSchedulerPermittedIdentifiers: [com.simplecityapps.shuttle.sync, com.simplecityapps.shuttle.scrobble]
        # This device's music (#590): Documents shows in Files ("On My iPhone > Shuttle Music") and Finder's file
        # sharing, so music can be copied in, and files opened there are read in place.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Jellyfin and Emby servers are often plain http on the LAN, or https with a self-signed
        # certificate; the servers' own iOS apps allow both the same way (#587). Do NOT add
        # NSAllowsLocalNetworking: on iOS 10+ it makes the system ignore NSAllowsArbitraryLoads, which
        # would break a plain-http server reached by a public hostname (#608).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Local network access prompt (#608): the app discovers and connects to Jellyfin/Emby/Plex/Navidrome
        # servers on the user's LAN, not for any tracking or discovery purpose.
        NSLocalNetworkUsageDescription: "Shuttle Music uses your local network to find and connect to Jellyfin, Emby, Plex and Navidrome media servers on your Wi-Fi network."
        # The app only uses standard HTTPS/TLS to reach user-configured media servers; no proprietary
        # or non-exempt encryption (#608).
        ITSAppUsesNonExemptEncryption: false
        # Read at launch by SentryCrashReporter and PostHogProductAnalytics (#776); empty unless the generated
        # Config/Telemetry.local.xcconfig sets them.
        S2SentryDSN: $(S2_SENTRY_DSN)
        S2PostHogAPIKey: $(S2_POSTHOG_API_KEY)
        S2PostHogHost: $(S2_POSTHOG_HOST)
        # Read by IosScrobblingModule (#503); empty unless the generated Config/LastFm.local.xcconfig sets them, and
        # then the Scrobbling settings row is hidden.
        S2LastFmApiKey: $(S2_LASTFM_API_KEY)
        S2LastFmSharedSecret: $(S2_LASTFM_SHARED_SECRET)
        # NowPlayingStore's container (#758)
        S2AppGroup: $(S2_APP_GROUP)
        # CarPlay (#692): the car's scene goes to CarPlaySceneDelegate. The phone's scene isn't listed, so SwiftUI's
        # App lifecycle makes its WindowGroup scene as before (multiple scenes on, as the generated manifest had it).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        # The App Group the widgets read Now Playing from (#758), and CarPlay's audio app category (#692; the app
        # only, not the widgets). Both App IDs (.dev and the store one) have CarPlay Audio App and the App Group
        # enabled in the developer portal (#917).
        CODE_SIGN_ENTITLEMENTS: S2/S2.entitlements
        # Debug installs beside the store app; Release is the App Store Connect bundle id (configs below).
        PRODUCT_BUNDLE_IDENTIFIER: com.simplecityapps.shuttle.dev
        PRODUCT_NAME: S2
        GENERATE_INFOPLIST_FILE: true
        # The neutral accent: Assets.xcassets' AccentColor (near-black / near-white). The system ignores a neutral asset as the global tint, so S2App applies .tint(.s2Accent) and AccentTint sets UIKit's (Theme/Colors.swift).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Assets.xcassets/AppIcon.appiconset, rendered from ios/design/*.svg by scripts/render-app-icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Shuttle Music"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: targeted
        # xcodegen's iOS application preset sets this per target, overriding the project default above.
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # The shared-framework slice is chosen by SDK, not configuration: `-framework Shared` takes the
        # first Shared.framework on the search path, and the simulator slice does not link for a device.
        # Build the one you need first with scripts/build-framework.sh.
        Debug:
          "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
          "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "-framework"
            - "Shared"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.simplecityapps.shuttle
          "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
          "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "-framework"
            - "Shared"
  # The widget extension (#758): Now Playing widgets and the iOS 18 play/pause control. It shares
  # SystemSurfaces/ with the app (the playback App Intents, NowPlayingStore) and doesn't link Shared: what it
  # shows comes from the App Group, and its buttons' intents run in the app.
  S2Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: S2Widgets
      - path: SystemSurfaces
    entitlements:
      path: S2Widgets/S2Widgets.entitlements
      properties:
        com.apple.security.application-groups: ["$(S2_APP_GROUP)"]
    info:
      path: S2Widgets/Info.plist
      properties:
        CFBundleDisplayName: Shuttle Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        S2AppGroup: $(S2_APP_GROUP)
    settings:
      base:
        # The app's bundle id plus .widgets, Debug and Release alike (an extension's must start with its app's)
        PRODUCT_BUNDLE_IDENTIFIER: com.simplecityapps.shuttle.dev.widgets
        PRODUCT_NAME: S2Widgets
        GENERATE_INFOPLIST_FILE: true
        APPLICATION_EXTENSION_API_ONLY: true
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: targeted
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.simplecityapps.shuttle.widgets
  S2Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: S2Tests
    dependencies:
      - target: S2
      - package: ViewInspector
      # The tagged audio fixtures, for the local library's embedded artwork
      - package: S2Playback
        product: S2PlaybackTestSupport
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/S2.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/S2
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: targeted
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # Search path only, for `import Shared`: the Kotlin code is linked into the host app, and the
        # test bundle resolves it through BUNDLE_LOADER. Linking the static framework here as well
        # would put a second Kotlin runtime in the process.
        Debug:
          FRAMEWORK_SEARCH_PATHS:
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
schemes:
  S2:
    build:
      targets:
        S2: all
        S2Tests: [test]
    run:
      config: Debug
      storeKitConfiguration: S2.storekit
    test:
      config: Debug
      # The tests assert English (US) text; pin it so a host or simulator in en-GB, en-AU, ... doesn't pick en-GB.lproj.
      language: en
      region: US
      targets:
        - S2Tests
